# Copy this file and replace the group and item IDs with real configured objects.
schema: 1
wave: example
source:
  server: golden.oak
  product: edge
content:
  - group: default
    kind: variables
    items:
      - example-variable
  - group: default
    kind: destinations
    items:
      - example-destination
