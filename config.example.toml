# Cribl MCP Server Configuration

[defaults]
verify_ssl = true
timeout_ms = 10_000
oauth_token_url = "https://login.cribl.cloud/oauth/token"
oauth_audience = "https://api.cribl.cloud"
# Optional shared macOS Keychain service name for on-prem passwords.
# keychain_name = "shared-cribl-login"
# Safe root for strict multi-leader YAML manifests. Relative paths are resolved
# from the repository root. SNC_CRIBL_MANIFEST_ROOT can override this value.
manifest_root = "manifests"


# Begin list of on-prem or cloud servers.
# Server names can be referenced in prompts.
# If no server name is specified, the first server in the list is the default.

[onprem.server]
url = "http://localhost:19000"
# username is optional for on-prem and defaults to the local macOS user.
# username = "admin"
# password is optional for on-prem and defaults to macOS Keychain service
# "snc-cribl-mcp:onprem.server", then env fallbacks such as ONPREM_SERVER_PASS.
# keychain_name is optional for on-prem and overrides the Keychain service name.
# keychain_name = "onprem-server-login"

[cribl.cloud]
url = "https://your-organization-name.cribl.cloud"
client_id = "..."
client_secret = "${CRIBL_CLIENT_SECRET}"
